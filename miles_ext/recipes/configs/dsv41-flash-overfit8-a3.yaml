# overfit8 with harder tasks and a training rule that drops no group (attempt a3 of the DeepSeek
# V4.1 overfitting run). Same 3 B300 nodes, layout, model and 256k context as
# dsv41-flash-overfit8.yaml; what differs:
# - tasks: the 4 tasks overfit-1018-a1/a2 solved 79-99% of the time are replaced by 4 harder ones
#   (the .tasks file), aiming at a ~0.5 pass rate so few groups come out all-equal;
# - algorithm: rewards centered on the group mean without the std division, no group filter
#   (an all-equal group trains nothing either way, dropping it only made the batch wait), and
#   score centering with TIS against FP4-engine and staleness drift, averaged over tokens;
# - a trial that fills the 256k window scores 0;
# - staleness at most 1 (a2's rollout led its trainer by ~18 min, so this costs no step time);
# - 10 steps, weights saved at steps 5 and 10.
# Needs what dsv41-flash-overfit8.yaml needs, with prompts/overfit8_a3.jsonl (the .tasks file says
# how it is made).
name: dsv41-flash-overfit8-a3
model:
  preset: deepseek-v4.1-flash
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
cluster:
  gpu: B300
  nodes: 3
  train_gpus: 16
  cpu: 32
  # the layer-input checkpoints sit in pinned host memory (ckpt_offload below): 758 GiB peak per
  # trainer node at 256k in the trainer's 2-node replay
  memory_gib: 1024
  disk_gib: 3072  # Modal's max; Adam's state is ~2.0 TiB per trainer node (8 B/param, bf16 moments)
  timeout_hours: 24
parallel:
  tp: 4
  pp: 2
  cp: 2
  ep: 8
optimizer:
  offload: disk
  moment_dtype: bf16
  grad_dtype: bf16
rollout:
  gpus_per_engine: 4
  precision: fp8_fp4
  context_length: 262144
  max_running_requests: 128
taskset:
  tasks_volume: miles-datasets:/tb4t-20261016/tasks
  prompts: $MILES_DATA/prompts/overfit8_a3.jsonl
  harness: mini-swe-agent-sandbox
agent:
  # the 1017 eval's agent, so its pass rates carry over
  max_steps: 256
  exec_timeout: 300
  timeout: 7200
  trial_timeout: 10800
  verifier_timeout: 3600
  setup_timeout: 1800
  context_exhausted_scores_zero: true
sandbox:
  provider: sail
  lifetime_secs: 14400
  idle_secs: 3600
  build_timeout_multiplier: 3  # 600 s task default -> 1,800 s
algorithm:
  mode: fully_async
  num_rollout: 10
  rollout_batch_size: 8  # = the task count
  n_samples: 8  # global batch 64 = one optimizer step per rollout
  temperature: 1.0
  max_response_len: 32768
  max_seq_len: 262144
  lr: 1.0e-6
  eps_clip: 0.2
  eps_clip_high: 0.28
  tis_clip: 2.0
  max_weight_staleness: 1
  sglang_mem_fraction: 0.75
  routing_replay: true
  grpo_std_normalization: false
  per_token_loss: true
  loss: score_centering
  # 32 candidates matched the full vocabulary in the score-centering paper at 4x less data than 128
  top_logprobs: 32
async:
  max_concurrent_samples: 128  # two batches in flight
checkpoint:
  save_interval: 5  # weights only (Adam's ~4.4 TB is not saved): a preempted run resumes from step 5
  keep: 1
  save_optimizer: false
  save_rollout_data: true  # a trainer failure replays on trainer nodes alone
tracking:
  wandb_project: miles-dsv41
  wandb_entity: mobiuslab
