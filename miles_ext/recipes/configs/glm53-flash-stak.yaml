# GLM-5.3-Flash, full-parameter RL in one cluster ("together" mode) on two B300:8 nodes: the whole trainer
# on the first (TP8 EP8 PP1; BF16 weights + bf16 grads ~160 GB per GPU), two TP4 engines serving the FP8
# release on the second, NCCL weight sync, R3, fully async. Adam's fp32 state (~2.6 TB with bf16 moments)
# streams per step: what the trainer node's memory leaves (recipe.optimizer_host_gib, fix-073) stays in pinned
# host memory, the rest on node-local disk. Single-turn STAK prompts (ext-038) at short context: this checks
# that the full model fits and trains on one node before long-context agentic runs (which need the long-context indexer).
# Needs: zai-org/GLM-5.3-Flash at model.revision on the weights volume (prepare_weights); MILES_DATA = a
# dir holding prompts/stak32.jsonl (miles-ops notes/oodtask); WANDB_API_KEY in the launcher's .env.
name: glm53-flash-stak
model:
  preset: glm-5.3-flash
  revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
cluster:
  gpu: B300
  nodes: 2  # 1 trainer + 1 rollout
  train_gpus: 8
  cpu: 64
  # sizes the pinned Adam tier: (2304 - TRAINER_HOST_RESERVE_GIB) / 8 GPUs = 150 GiB per GPU
  memory_gib: 2304
  disk_gib: 3072  # Modal's max; the Adam state host memory does not hold (~1.2 TB)
  timeout_hours: 3
parallel:
  tp: 8
  pp: 1
  cp: 1  # GLM's DSA refuses context parallelism
  ep: 8
optimizer:
  offload: disk
  moment_dtype: bf16
  grad_dtype: bf16
rollout:
  gpus_per_engine: 4
  context_length: 32768
  max_running_requests: 128
taskset:
  prompts: $MILES_DATA/prompts/stak32.jsonl
  harness: single-turn
algorithm:
  mode: fully_async
  num_rollout: 3
  rollout_batch_size: 32
  n_samples: 8
  temperature: 1.0
  max_response_len: 8192
  max_seq_len: 16384
  max_tokens_per_gpu: 16384
  lr: 1.0e-6
  max_weight_staleness: 2
  sglang_mem_fraction: 0.75
  routing_replay: true
async:
  max_concurrent_samples: 256
checkpoint:
  save_interval: 3  # weights only, at the last step
  keep: 1
  save_optimizer: false
  save_rollout_data: true
tracking:
  wandb_project: miles-glm53
  wandb_entity: mobiuslab
