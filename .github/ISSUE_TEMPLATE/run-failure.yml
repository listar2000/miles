name: Run failure
description: A run broke or misbehaved (crash, hang, OOM, zero reward, wrong numbers).
labels: ["needs-triage", "run-failure"]
body:
  - type: markdown
    attributes:
      value: "Read fork/guide/running.md and fork/guide/limits.md first; many failures have a known first check."
  - type: input
    id: version
    attributes:
      label: Trainer version
      description: "`latest` resolution, `stable-YYYY-MM-DD`, image digest or fork commit"
    validations:
      required: true
  - type: textarea
    id: recipe
    attributes:
      label: Recipe
      description: The recipe YAML, or its diff from a shipped one in miles_ext/recipes/configs/
      render: yaml
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Run id and W&B run
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: First error lines
      description: From the first Traceback or ERROR in the app log, not only the last line. Remove credentials.
      render: text
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Already tried
