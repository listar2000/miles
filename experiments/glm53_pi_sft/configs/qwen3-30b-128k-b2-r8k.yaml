# Qwen3-30B-A3B-Thinking-2507 on the GLM-5.3-Flash Pi traces (README.md), 128K, the tmax Qwen3-30B schedule.
model: qwen3-30b-a3b-thinking-2507
commit: f9625d4840e093252fff40a7c5ca93e547e376ff  # launch/round3: #162 + #168
data:
  volume: miles-rl-datasets
  records: sft/tb2-pi-glm53flash/records
  shards: sft/tb2-pi-glm53flash/qwen3-30b-128k-b2-r8k
  max_tokens: 131072
  postprocess: [experiments.glm53_pi_sft.postprocess.untrain_no_reasoning, experiments.glm53_pi_sft.postprocess.untrain_long_reasoning]
train:
  epochs: 1
  batch: 128
  lr: 2.0e-5
  decay: linear
  warmup: 0.03
  cp: 4
val: {interval: 10}
tracking: {wandb_project: miles-sft}
