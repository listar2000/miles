# STAK overfit on GLM-5.3-Flash LoRA r32: split on two half nodes, PPO clip + MIS, DFlash2, top-p replay, thinking low.
# Prompts: ../prompts/stak_l4_16.jsonl, graded by experiments/dsv41_stak_overfit/stackvm.py.
name: glm53-flash-lora-overfit-stakl4
model:
  preset: glm-5.3-flash-dflash2
  revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
cluster:
  gpu: B300
  nodes: 1
  train_gpus: 4
  cpu: 32
  memory_gib: 640
  timeout_hours: 1.75
  placement: split
  engine:
    gpus: 4
    idle_minutes: 10
parallel:
  tp: 4
  pp: 1
  cp: 1
  ep: 4
lora:
  rank: 32
  alpha: 32
  target_modules: attn,mlp
rollout:
  gpus_per_engine: 4
  context_length: 32768
  max_running_requests: 64
taskset:
  prompts: ../prompts/stak_l4_16.jsonl
  harness: single-turn
algorithm:
  mode: fully_async
  num_rollout: 16
  rollout_batch_size: 16
  n_samples: 8
  temperature: 1.0
  top_p: 0.95
  top_k: 32
  max_response_len: 6144  # a capped reply usually scores 0; G2 at 4096 capped 22.5% of L4 replies
  max_seq_len: 8192
  max_tokens_per_gpu: 8192
  lr: 1.0e-4
  eps_clip: 0.2
  eps_clip_high: 0.28
  max_weight_staleness: 2
  sglang_mem_fraction: 0.75
  routing_replay: true
  grpo_std_normalization: false
  per_token_loss: true
  loss: policy_loss
  is_correction: mis
async:
  max_concurrent_samples: 128
checkpoint:
  save_interval: 8
  keep: 1
  save_optimizer: true
  save_rollout_data: true
tracking:
  wandb_project: miles-glm53
  wandb_entity: mobiuslab
  tags: ["exp:overfit-stak-l4"]
extra_args:
  - --check-lora-weight-equal
  - --no-gradient-accumulation-fusion
  - --async-data-buffer-capacity-factor  # the trainer is the slower side; a smaller buffer keeps batches fresh
  - "1.0"
  - --apply-chat-template-kwargs
  - '{"reasoning_effort": "low"}'
