# GLM-5.3-Flash LoRA (rank 32) with the DFlash2 draft, score centering, MIS and top-p replay on one B300:8: the trainer on 4 GPUs
# (TP4 EP4), one TP4 engine on the other 4, 5 rollouts on the single-turn STAK prompts at a low reasoning effort.
# Needs: zai-org/GLM-5.3-Flash at model.revision and the preset's draft on the weights volume (prepare_weights);
# MILES_DATA = experiments/dsv41_stak_overfit; WANDB_API_KEY in the launcher's .env.
name: glm53-flash-lora-dflash2
model:
  preset: glm-5.3-flash-dflash2
  revision: 46a050bec13002ad29ee795c16e61cf4fa3c4a9c
cluster:
  gpu: B300
  nodes: 1
  train_gpus: 4
  cpu: 64
  memory_gib: 1280
  timeout_hours: 1
parallel:
  tp: 4
  pp: 1
  cp: 1
  ep: 4
lora:
  rank: 32
  alpha: 32
  target_modules: attn,mlp
rollout:
  gpus_per_engine: 4
  context_length: 32768
  max_running_requests: 64
taskset:
  prompts: $MILES_DATA/prompts/stak32.jsonl
  harness: single-turn
algorithm:
  mode: fully_async
  num_rollout: 5
  rollout_batch_size: 4
  n_samples: 8
  temperature: 1.0
  top_p: 0.95
  top_k: 32
  max_response_len: 4096
  max_seq_len: 8192
  max_tokens_per_gpu: 8192
  lr: 1.0e-4
  max_weight_staleness: 0  # every trained sample comes from the served adapter version
  sglang_mem_fraction: 0.75
  routing_replay: true
  loss: score_centering
  is_correction: mis
async:
  max_concurrent_samples: 64
checkpoint:
  save_interval: 5
  keep: 1
  save_optimizer: true
  save_rollout_data: true
tracking:
  wandb_project: miles-glm53
  wandb_entity: mobiuslab
extra_args:
  - --check-lora-weight-equal
  - --no-gradient-accumulation-fusion
  - --apply-chat-template-kwargs
  - '{"reasoning_effort": "low"}'
