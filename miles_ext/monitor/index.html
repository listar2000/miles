<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Run monitor</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23b5b5b0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --panel: #ffffff; --surface-2: #f5f5f4; --ink: #111111; --ink-2: #5c5c59; --ink-3: #8c8c88;
  --muted: #8c8c88; --line: #e4e4e1; --grid: #ececea; --chip: #f5f5f4;
  --accent: #2a78d6; --good: #1baf7a; --warn: #eda100; --bad: #e34948; --run: #2a78d6; --idle: #b5b5b0; --live: #d9463f; --verify: #8a5cd0; --roll: #eb6834;
  --good-bg: #e8f6f0; --warn-bg: #fdf4e1; --bad-bg: #fcebeb; --info-bg: #eef4fc;
  --font: "Inter", -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
  /* one type scale: xs ticks, captions, table headers; sm secondary text; md body; lg titles; xl KPI values */
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 22px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --panel: #161616; --surface-2: #1e1e1e; --ink: #ececea; --ink-2: #a3a3a0; --ink-3: #6f6f6c;
    --muted: #8a8a86; --line: #2a2a29; --grid: #242423; --chip: #1e1e1e;
    --accent: #3987e5; --good: #199e70; --warn: #c98500; --bad: #e66767; --run: #3987e5; --idle: #55554f; --verify: #9b78e0; --roll: #d95926;
    --good-bg: #13261f; --warn-bg: #2a2210; --bad-bg: #2c1717; --info-bg: #142033;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --panel: #161616; --surface-2: #1e1e1e; --ink: #ececea; --ink-2: #a3a3a0; --ink-3: #6f6f6c;
  --muted: #8a8a86; --line: #2a2a29; --grid: #242423; --chip: #1e1e1e;
  --accent: #3987e5; --good: #199e70; --warn: #c98500; --bad: #e66767; --run: #3987e5; --idle: #55554f; --verify: #9b78e0; --roll: #d95926;
  --good-bg: #13261f; --warn-bg: #2a2210; --bad-bg: #2c1717; --info-bg: #142033;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs-md); line-height: 1.45; -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.nav-inner { max-width: 1440px; margin: 0 auto; padding: 0 20px; height: 48px; display: flex; align-items: center; gap: 22px; }
h1 { font-size: var(--fs-lg); font-weight: 600; margin: 0; white-space: nowrap; }
nav { display: flex; gap: 2px; height: 100%; overflow-x: auto; scrollbar-width: none; }
nav a { display: flex; align-items: center; gap: 6px; padding: 0 9px; color: var(--ink-2); text-decoration: none; position: relative; white-space: nowrap; }
nav a:hover { color: var(--ink); text-decoration: none; }
nav a.on { color: var(--ink); }
nav a.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; background: var(--ink); }
nav .count { font-size: var(--fs-xs); color: var(--ink-3); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.conn { font-size: var(--fs-sm); color: var(--ink-3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.conn .dot { margin: 0; }
.conn.live .dot { background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2.4s infinite; }
.conn.down .dot { background: var(--bad); }
.conn.poll .dot { background: var(--warn); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.icon-btn { width: 28px; height: 28px; border-radius: 4px; border: 0; background: none; color: var(--ink-2); cursor: pointer; font-size: var(--fs-lg); padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.on { color: var(--accent); }
.errbar { max-width: 1440px; margin: 0 auto; padding: 6px 20px 0; font-size: var(--fs-sm); color: var(--ink-3); }
.errbar:empty { display: none; }
main { max-width: 1440px; margin: 0 auto; padding: 14px 20px 48px; }
.panel, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; min-width: 0; }
.panel h2 { font-size: var(--fs-lg); font-weight: 600; margin: 0 0 10px; }
.panel h3, .section-label { font-size: var(--fs-xs); margin: 14px 0 6px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin: 22px 0 10px; flex-wrap: wrap; }
.page-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; }
.group-head { display: flex; gap: 12px; align-items: baseline; margin: 16px 0 8px; flex-wrap: wrap; }
.group-title { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.grid .card { margin: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.card-title { font-weight: 600; font-size: var(--fs-md); }
.card-val { font-size: var(--fs-md); }
.card-head.stack { flex-direction: column; align-items: flex-start; gap: 0; } .card-head.stack .card-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; } .card-val { white-space: nowrap; }
.card-note { color: var(--ink-3); font-size: var(--fs-sm); min-height: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
.chart-card canvas { width: 100%; display: block; cursor: crosshair; user-select: none; }
.card-val .nv { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; color: var(--ink); } .card-val .nv:last-child { margin-right: 0; }
.readout .nv { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); } .readout .nv i, .card-val .nv i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
/* the hover readout sits over the card header, so no blank band is kept under the plot */
.chart-card { position: relative; padding-bottom: 8px; }
.chart-card .readout { position: absolute; left: 14px; right: 14px; top: 10px; min-height: 0; background: var(--panel); font-size: var(--fs-sm); color: var(--ink-2); line-height: 18px; }
.chart-card .readout:empty { display: none; }
.chart-card[data-custom] .readout { position: static; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 10px; background: none; color: var(--ink-2); }
.seg button.on { background: var(--surface-2); color: var(--ink); }
.x { border: 0; background: none; color: var(--ink-3); padding: 0 4px; }
.explorer { margin-bottom: 12px; }
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
.modal.hidden { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
.modal-card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; width: min(1100px, calc(100vw - 32px)); }
.modal-card canvas { width: 100%; display: block; }
.modal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.modal-title { font-weight: 600; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-md); }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th, th.num, th.small { color: var(--ink-3); font-weight: 500; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--ink); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--chip); border: 1px solid var(--line); font-size: var(--fs-sm); margin: 1px 2px 1px 0; white-space: nowrap; }
a.chip { color: var(--ink-2); } a.chip:hover { color: var(--ink); text-decoration: none; border-color: var(--ink-3); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex: none; }
.t-run { background: var(--run); } .runcard-title .t-run, .run-head .t-run { animation: pulse-run 2.4s infinite; }  /* running is blue (like in-flight trials); red only for failures */ .t-good { background: var(--good); } .t-bad { background: var(--bad); } .t-idle { background: var(--idle); } .t-warn { background: var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.panel, .runcard { container-type: inline-size; }
@container (min-width: 1040px) { .tiles { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); } }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.tile .v { font-size: var(--fs-xl); font-weight: 500; line-height: 1.15; white-space: nowrap; }
.tile .k, .kpi .k { color: var(--ink-2); font-size: var(--fs-sm); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s, .kpi .s { color: var(--ink-3); font-size: var(--fs-sm); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }  /* a qualifier may take two lines, never cut mid-word */
.bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); min-width: 120px; }
.barkey { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 6px; font-size: var(--fs-sm); color: var(--ink-2); }
.barkey i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.bar span { display: block; height: 100%; transition: width .4s ease; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num, td.num { padding-left: 24px; }
/* the per-step table: 13 columns, fitted to a laptop screen */
.tight th, .tight td { padding: 6px 5px; } .tight th.num, .tight td.num { padding-left: 10px; } .tight th { white-space: normal; vertical-align: bottom; line-height: 1.25; }
@media (max-width: 1399px) { .w14 { display: none; } }  /* a right-aligned column keeps clear of the left-aligned one before it */
.kpi .v, .tile .v, .feed .when, .step .when, .card-val, .tfoot { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: var(--fs-sm); }
.nowrap { white-space: nowrap; }
table.heat td { vertical-align: middle; }
table.heat td.hm { text-align: center; font-size: var(--fs-xs); min-width: 38px; padding: 3px 2px; color: var(--ink); font-variant-numeric: tabular-nums; }
table.heat .hc { text-align: center; padding: 3px 4px; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: var(--fs-md); color: var(--ink-3); font-weight: 400; }
.ttools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.seg button .muted { font-size: var(--fs-xs); }
.tfoot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 6px; }
.tfoot:empty, .tfoot:has(> span:empty:only-child) { display: none; }
.tfoot button { font-size: var(--fs-sm); padding: 2px 10px; }
.fold-h { cursor: pointer; user-select: none; margin: 0 !important; }
.fold.open .fold-h { margin-bottom: 10px !important; }
.fold.open > .spread { margin-bottom: 10px; }
.chev { display: inline-block; width: 1em; color: var(--ink-3); transition: transform .12s; }
.fold.open .chev { transform: rotate(90deg); }
.linkish { border: 0; background: none; padding: 2px 0; color: var(--ink-2); font-size: var(--fs-sm); }
.linkish:hover { color: var(--ink); text-decoration: underline; }
.more { margin-top: 6px; }
.smooth { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); }
.smooth input[type=range] { padding: 0; width: 110px; accent-color: var(--run); }
pre { background: var(--surface-2); padding: 10px; border-radius: 6px; overflow: auto; max-height: 560px; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 0; }
.err { color: var(--bad); font-size: var(--fs-sm); }
.row { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
button, select, input { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--ink-3); }
input { cursor: text; }
input[type=search] { min-width: 220px; }
.legend span { margin-right: 12px; font-size: var(--fs-sm); color: var(--ink-3); }
.cells { display: flex; flex-wrap: wrap; gap: 2px; }
.cells i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
svg text { fill: var(--ink-3); font-size: var(--fs-xs); }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }

/* live run cards */
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.runcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--panel); }
.runcard-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.runcard-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.005em; }
.runcard-title a { color: var(--ink); }
.runcard .sub { color: var(--ink-2); font-size: var(--fs-sm); margin-top: 2px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 18px; margin: 14px 0 12px; }
@container (min-width: 1000px) { .kpis { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); } }
.kpi { min-width: 0; }
.kpi .v { font-size: var(--fs-xl); font-weight: 500; line-height: 1.15; white-space: nowrap; }
.kpi .v small { font-size: var(--fs-md); color: var(--ink-3); font-weight: 400; }
.kpi canvas { width: 100%; height: 28px; display: block; margin-top: 4px; }
.stepper { display: flex; gap: 0; margin: 12px 0 4px; overflow-x: auto; scrollbar-width: none; }
.step { flex: 1 1 0; min-width: 0; position: relative; padding: 14px 2px 0; font-size: var(--fs-xs); line-height: 1.3; color: var(--ink-3); text-align: center; overflow-wrap: anywhere; }
.step::before { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 2px; background: var(--line); }
.step:first-child::before { left: 50%; } .step:last-child::before { right: 50%; }
.step::after { content: ""; position: absolute; top: 0; left: calc(50% - 5px); width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); box-sizing: border-box; }
.step.done { color: var(--ink-2); } .step.done::before { background: var(--good); } .step.done::after { background: var(--good); border-color: var(--good); }
.step.stopped { color: var(--ink); font-weight: 600; } .step.stopped::after { background: var(--warn); border-color: var(--warn); }
.step.cur { color: var(--ink); font-weight: 600; } .step.cur::before { background: linear-gradient(90deg, var(--good) 50%, var(--line) 50%); }
.step.cur::after { border-color: var(--run); background: var(--run); animation: pulse-run 1.8s infinite; }
@keyframes pulse-run { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 55%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: none; } }
.step .when { display: block; font-weight: 400; color: var(--ink-3); font-size: var(--fs-xs); }
.signals { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 0; }
.signal { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 6px; font-size: var(--fs-sm); }
.signal.bad { background: var(--bad-bg); } .signal.warn { background: var(--warn-bg); } .signal.ok { background: var(--good-bg); } .signal.info { background: var(--info-bg); }
.signal b { font-weight: 600; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; flex: none; width: 34px; }
.signal.bad b { color: var(--bad); } .signal.warn b { color: var(--warn); } .signal.ok b { color: var(--good); } .signal.info b { color: var(--accent); }
.foot { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--ink-3); font-size: var(--fs-sm); margin-top: 10px; align-items: center; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }

/* feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 40px 8px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); align-items: baseline; }
.feed li:last-child { border-bottom: 0; }
.feed .when { color: var(--ink-3); font-size: var(--fs-sm); white-space: nowrap; }
.feed .lv { width: 7px; height: 7px; border-radius: 50%; align-self: start; margin-top: 6px; }
.lv.good { background: var(--good); } .lv.bad { background: var(--bad); } .lv.warn { background: var(--warn); } .lv.info { background: var(--idle); }
.feed .run { color: var(--ink-3); font-size: var(--fs-sm); }
.two-col { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 14px; align-items: start; }
.two-col > * { min-width: 0; }
.stepper, .bar { max-width: 100%; }

/* attempts strip */
.attempts { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
.attempt { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 220px; font-size: var(--fs-sm); }
.attempt.latest { border-color: var(--ink-3); }
.attempt .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }

/* trial cap bar */
.cap { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); min-width: 90px; overflow: hidden; }
.cap span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.cap i { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); }

/* live log */
.logpane { max-height: 520px; overflow: auto; background: var(--surface-2); border-radius: 6px; padding: 8px 0; font: 11.5px/1.5 var(--mono); }
.logpane div { padding: 0 10px; white-space: pre-wrap; word-break: break-word; }
.logpane .c-error { color: var(--bad); } .logpane .c-stage { color: var(--good); font-weight: 600; } .logpane .c-trial { color: var(--accent); } .logpane .c-engine { color: var(--ink-3); }
.logpane .ts { color: var(--ink-3); margin-right: 8px; }
.logpane div.new { animation: flash 1.2s ease-out; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.toggle { padding: 2px 9px; border-radius: 12px; font-size: var(--fs-sm); color: var(--ink-3); }
.toggle.on { color: var(--ink); background: var(--surface-2); border-color: var(--ink-3); }

/* GPUs tab: workstream colours, fixed order (dataviz reference categorical palette) */
:root { --ws1: #2a78d6; --ws2: #eb6834; --ws3: #1baf7a; --ws4: #eda100; --ws5: #e87ba4; --ws6: #008300; --ws7: #6250d6; --ws8: #e34948; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ws1: #3987e5; --ws2: #d95926; --ws3: #199e70; --ws4: #c98500; --ws5: #d55181; --ws6: #008300; --ws7: #9085e9; --ws8: #e66767; } }
:root[data-theme="dark"] { --ws1: #3987e5; --ws2: #d95926; --ws3: #199e70; --ws4: #c98500; --ws5: #d55181; --ws6: #008300; --ws7: #9085e9; --ws8: #e66767; }
.wsdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.sharebar { display: flex; gap: 2px; height: 14px; margin: 4px 0 8px; }
.sharebar span { border-radius: 3px; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); }
section.ws { margin: 18px 0 6px; }
.ws-head { margin: 0 0 8px; }
.ws-head h3 { margin: 0 0 2px; font-size: var(--fs-md); color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.gpucard { border-left: 3px solid var(--idle); }
.gpu-meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 8px 0; }
.gpu-meta .k { color: var(--ink-3); }
.gpu-conts { margin: 4px 0; }
.warnchip { background: var(--warn-bg); border-color: var(--warn); color: var(--ink); }
.notice.warn { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 6px; padding: 6px 10px; margin: 8px 0; }
.kpi .v.small-v { font-size: var(--fs-lg); padding-top: 5px; }
svg.gpuchart { width: 100%; height: 150px; display: block; overflow: visible; }
svg.gpuchart .gridline { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chartwrap { position: relative; margin-left: var(--lane-g); }
.chartwrap .ylbl { position: absolute; right: calc(100% + 8px); transform: translateY(-50%); white-space: nowrap; font-size: var(--fs-xs); color: var(--ink-3); pointer-events: none; }
.xlbls { position: relative; height: 16px; margin: 2px 0 6px var(--lane-g); }
.xlbls span { position: absolute; transform: translateX(-50%); font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
svg.gpuchart.bill { height: 130px; }
svg.gpuchart .hit { fill: transparent; }
svg.gpuchart .hit:hover { fill: var(--ink); fill-opacity: .06; }
.lanes { margin: 10px 0 4px; display: grid; gap: 3px; }
/* the 24 h charts and the app lanes share one left gutter, so their time axes line up */
:root { --lane-g: 200px; }
.lane { display: grid; grid-template-columns: calc(var(--lane-g, 200px) - 10px) 1fr; gap: 10px; align-items: center; }
.lane-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-track { position: relative; height: 16px; background: var(--surface-2); border-radius: 3px; }
.lane-track span { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; color: #fff; font-size: var(--fs-xs); line-height: 12px; padding-left: 3px; overflow: hidden; white-space: nowrap; }
@media (max-width: 640px) { :root { --lane-g: 106px; } svg.gpuchart, svg.gpuchart.bill { height: 120px; } .xlbls span:nth-child(even) { display: none; } }

svg.tl text { font-family: var(--font); }
svg.tl .tl-l { font-size: var(--fs-sm); fill: var(--ink-2); }
svg.tl .tl-k { font-size: var(--fs-xs); fill: var(--ink-3); }
#curves .page-head { margin-top: 0; }
#curves .group-head .legend { margin: 0 0 0 auto; }
.lane-group { font-size: var(--fs-sm); font-weight: 600; margin: 8px 0 2px; display: flex; align-items: center;  gap: 6px; }
.lanes .more { margin: 4px 0; }
td.c-task { min-width: 260px; width: 30%; word-break: normal; overflow-wrap: anywhere; } td.c-run { min-width: 300px; width: 42%; } .runlinks { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font-size: var(--fs-sm); } .runlinks .ilink { color: var(--ink-2); white-space: nowrap; } .runlinks .ilink:hover { color: var(--accent); } td.c-links { min-width: 220px; width: 18%; } td.c-links a, td.c-links .pill { white-space: nowrap; display: inline-block; margin: 0 4px 4px 0; }
svg.tl .tl-in { font-size: var(--fs-xs); fill: var(--ink); pointer-events: none; }  /* inside a bar: plain ink on the tinted bars, white (.w) on solid ones; no halo */
svg.tl .tl-in.w { fill: #fff; stroke: none; }
svg.tl .tl-mark { font-size: var(--fs-xs); fill: var(--ink-2); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.tl-legend, .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
.tl-legend i, .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend { font-size: var(--fs-sm); color: var(--ink-2); margin: 0 0 4px; }
#curves.cols-1 .grid { grid-template-columns: 1fr; }
#curves.cols-2 .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#curves.cols-3 .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) { #curves.cols-2 .grid, #curves.cols-3 .grid { grid-template-columns: 1fr; } }
@media (max-width: 1180px) { .two-col { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .nav-inner, main, .errbar { padding-left: 16px; padding-right: 16px; }
  .nav-inner { height: auto; flex-wrap: wrap; gap: 0 12px; padding-top: 8px; }
  h1 { flex: 1; }
  .nav-right { order: 2; }
  nav { order: 3; width: 100%; height: 38px; margin: 0 -9px; }
  .grid { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .runs-table thead { display: none; }
  .runs-table tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .runs-table td { display: block; border: 0; padding: 2px 0; }
  .runs-table .bar { min-width: 0; }
  input[type=search] { min-width: 0; width: 100%; }
  .conn span.txt { display: none; }
}

/* ---- run types: RL training is the default look; evals, benches and smokes carry a tinted pill and an edge ---- */
:root { --t-train: var(--accent); --t-eval: #7b4fc9; --t-bench: #0f8a8a; --t-smoke: var(--ink-3); --t-other: var(--idle); --cmp-a: #2a78d6; --cmp-b: #e0632a; }
:root[data-theme="dark"] { --t-eval: #a98bea; --t-bench: #3cbcbc; --cmp-a: #4a92ea; --cmp-b: #ef7a45; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --t-eval: #a98bea; --t-bench: #3cbcbc; --cmp-a: #4a92ea; --cmp-b: #ef7a45; } }
.tpill { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 10px; font-size: var(--fs-xs); font-weight: 600; line-height: 18px; white-space: nowrap; letter-spacing: .02em;
  color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, transparent); border: 1px solid color-mix(in srgb, var(--tc) 30%, transparent); }
.tpill svg { width: 11px; height: 11px; }
.t-train { --tc: var(--t-train); } .t-eval { --tc: var(--t-eval); } .t-bench { --tc: var(--t-bench); } .t-smoke { --tc: var(--t-smoke); } .t-other { --tc: var(--t-other); }
.typed { border-left: 3px solid var(--tc, var(--line)); }
.typed.t-train { border-left-color: var(--line); }
/* ---- Runs tab: groups ---- */
.runs-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.runs-head h2 { margin: 0 8px 0 0 !important; }
.runs-head input[type=search] { min-width: 220px; }
.grp { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.grp-h { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; user-select: none; }
.grp-h:hover { background: var(--surface-2); }
.grp-h .chev { color: var(--ink-3); transition: transform .12s; display: inline-block; }
.grp.open .grp-h .chev { transform: rotate(90deg); }
.grp-name { font-weight: 600; font-size: var(--fs-lg); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.grp-meta { color: var(--ink-3); font-size: var(--fs-sm); text-align: right; white-space: nowrap; }
.grp-best { color: var(--ink-2); font-size: var(--fs-sm); font-weight: 400; }
.grp-body { border-top: 1px solid var(--line); padding: 0 14px 4px; }
.grp-body table { table-layout: fixed; width: 100%; }
.grp-body td { vertical-align: top; }
.rt-sel { width: 30px; } .rt-status { width: 108px; } .rt-res { width: 25%; } .rt-dur { width: 70px; } .rt-cost { width: 78px; } .rt-start { width: 112px; }
.rt-title { color: var(--ink-3); font-size: var(--fs-sm); }
.res-bar { display: inline-block; width: 56px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: 1px; margin-right: 6px; overflow: hidden; }
.res-bar i { display: block; height: 100%; background: var(--good); }
.cb { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; margin: 2px 0 0; }
.grp-more { padding: 6px 0 8px; }
/* the compare tray */
.tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 10px 14px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); flex-wrap: wrap; }
.tray .slot { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.sw.a { background: var(--cmp-a); } .sw.b { background: var(--cmp-b); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.primary:disabled { opacity: .4; cursor: default; }
/* ---- run page: a jump bar under the header ---- */
.jump { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.jump a { font-size: var(--fs-sm); color: var(--ink-2); padding: 2px 8px; border-radius: 4px; }
.jump a:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.run-head-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.run-head-top h2 { margin: 0 !important; }
.headline { display: flex; gap: 28px; flex-wrap: wrap; margin: 12px 0 2px; }
.headline .hv { font-size: var(--fs-xl); font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.headline .hk { color: var(--ink-2); font-size: var(--fs-sm); }
.headline .hs { color: var(--ink-3); font-size: var(--fs-sm); }
.headline .hv small { font-size: var(--fs-md); font-weight: 400; }
.rt-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ---- phases chart: hover cursor, tooltip, zoom ---- */
.tl-wrap { position: relative; }
.tl-wrap svg.tl { cursor: crosshair; user-select: none; }
svg.tl rect.seg:hover { stroke: var(--ink); stroke-width: 1.2; }
.tl-cursor { position: absolute; top: 0; width: 1px; background: var(--ink-3); pointer-events: none; display: none; }
.tl-sel { position: absolute; top: 0; background: color-mix(in srgb, var(--accent) 14%, transparent); pointer-events: none; display: none; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  padding: 8px 10px; font-size: var(--fs-sm); line-height: 1.5; min-width: 220px; max-width: 380px; display: none; }
.tip b { font-weight: 600; }
.tip .tk { color: var(--ink-3); display: inline-block; min-width: 64px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
/* ---- compare ---- */
.cmp-head { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cmp-run { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; border-top: 3px solid var(--c); }
.cmp-run.a { --c: var(--cmp-a); } .cmp-run.b { --c: var(--cmp-b); }
.cmp-run .rid { font-weight: 600; font-size: var(--fs-lg); }
table.facts td, table.facts th { padding: 6px 10px; }
table.facts td.va, table.facts td.vb { font-variant-numeric: tabular-nums; }
table.facts tr.diff td.vb, table.facts tr.diff td.va { font-weight: 600; }
.delta { font-size: var(--fs-xs); color: var(--ink-3); margin-left: 6px; font-weight: 400; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
/* ---- eval results ---- */
.lvl td { vertical-align: middle; }
.pbar { display: inline-block; width: 120px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; vertical-align: middle; margin-right: 8px; }
.pbar i { display: block; height: 100%; background: var(--t-eval); }
.kbar { display: flex; width: 160px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.kbar i { display: block; height: 100%; }
.answer { white-space: pre-wrap; font-family: var(--mono); font-size: var(--fs-sm); background: var(--surface-2); border-radius: 6px; padding: 8px 10px; max-height: 220px; overflow: auto; margin: 4px 0 10px; }
.srcnote { font-size: var(--fs-sm); color: var(--ink-3); margin: 8px 0 0; }
.errchip { font-size: var(--fs-sm); color: var(--ink-3); cursor: help; white-space: nowrap; }
.errchip .dot { background: var(--warn); }
</style>
</head>
<body>
<header><div class="nav-inner">
  <h1 id="title">Run monitor</h1>
  <nav id="nav"></nav>
  <div class="nav-right">
    <span class="conn" id="conn" title="connection"><span class="dot t-idle"></span><span class="txt">connecting…</span></span>
    <button class="icon-btn" id="notify" title="Browser notifications for solved trials and problems" aria-label="Notifications"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2.2a4 4 0 0 0-4 4v2.6L2.8 11h10.4L12 8.8V6.2a4 4 0 0 0-4-4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.4 12.6a1.7 1.7 0 0 0 3.2 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></button>
  </div>
</div></header>
<div class="errbar" id="errbar"></div>
<main id="main"><div class="empty">loading…</div></main>
<div class="modal hidden" id="modal"><div class="modal-backdrop" onclick="this.parentNode.classList.add('hidden')"></div>
  <div class="modal-card"><div class="modal-head"><span class="modal-title"></span><button class="icon-btn" onclick="document.getElementById('modal').classList.add('hidden')">✕</button></div>
  <canvas></canvas><div class="card-note modal-readout"></div></div></div>
<div class="tip" id="tip"></div>
<script src="curves.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>
</body>
</html>
