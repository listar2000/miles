# overfit8 attempt a5 of the DeepSeek V4.1 overfitting run: 8 tasks x 16 tries (global batch 128,
# one optimizer step per rollout), plain policy loss with TIS. Same model, 3 B300 nodes, layout and
# 256k context as dsv41-flash-overfit8-a4.yaml; what differs:
# - tasks: a4's four plus four with mixed outcomes (the .tasks file);
# - batch 128: the NVMe optimizer step costs ~21 min whatever the batch, so 128 samples train at
#   0.44 trainer-min per sample vs 0.63 at 64 (2-node replay, same peak memory);
# - saves are staged on node-local disk and uploaded in the background (ext-031), with a 60 min NCCL
#   timeout: a4's direct save to the Volume ran ~30 min and hit the 10 min timeout;
# - memory 1536 GiB per node and 64 CPUs, Modal's max (the session servers share the head trainer node with the
#   disk-streamed optimizer; in a4 they starved and dropped 15 groups);
# - the session collect timeout is main's 1800 s default (fix-017), not a4's 120 s;
# - weight staleness 4, as in a1/a2 (a3/a4 ran 1): telecom and software-009 tries run 70-120 min
#   (trials up to ~3 h), so their groups finish 2-3 ~1 h steps after they start and staleness 1
#   would drop them. In a1/a2 the cap of 4 never bound (observed max 1); in a4 one step of lag
#   moved the train-rollout KL 0.0028 -> 0.0030, and TIS bounds the rest.
# No in-loop eval: evals run offline from saved weights.
# Needs what dsv41-flash-overfit8.yaml needs, with prompts/overfit8_a5.jsonl (the .tasks file says
# how it is made).
name: dsv41-flash-overfit8-a5
model:
  preset: deepseek-v4.1-flash
  revision: 1bae0e1088993b9b82de08f59de5be5a34e42170
cluster:
  gpu: B300
  nodes: 3
  train_gpus: 16
  cpu: 64  # Modal's max request per container
  # ckpt_offload's pinned pool (~394 GiB on the busier node) + the 758 GiB peak at 256k, with room
  # for save staging buffers
  memory_gib: 1536
  # Modal's max: Adam's state ~2.0 TiB per trainer node (8 B/param, bf16 moments) + one staged
  # weights-only save (~0.5 TiB per node)
  disk_gib: 3072
  timeout_hours: 24
parallel:
  tp: 4
  pp: 2
  cp: 2
  ep: 8
optimizer:
  offload: disk
  moment_dtype: bf16
  grad_dtype: bf16
rollout:
  gpus_per_engine: 4
  precision: fp8_fp4
  context_length: 262144
  max_running_requests: 128
  expert_qat: true
taskset:
  tasks_volume: miles-datasets:/tb4t-20261016/tasks
  prompts: $MILES_DATA/prompts/overfit8_a5.jsonl
  harness: mini-swe-agent-sandbox
agent:
  # the 1017 eval's agent, so its pass rates carry over
  max_steps: 256
  exec_timeout: 300
  timeout: 7200
  trial_timeout: 10800
  verifier_timeout: 3600
  setup_timeout: 1800
  context_exhausted_scores_zero: true
sandbox:
  provider: sail
  lifetime_secs: 14400
  idle_secs: 3600
  build_timeout_multiplier: 3  # 600 s task default -> 1,800 s
algorithm:
  mode: fully_async
  num_rollout: 8
  rollout_batch_size: 8  # = the task count
  n_samples: 16  # global batch 128 = one optimizer step per rollout
  temperature: 1.0
  max_response_len: 32768
  max_seq_len: 262144
  lr: 1.0e-6
  eps_clip: 0.2
  eps_clip_high: 0.28
  tis_clip: 2.0
  max_weight_staleness: 4
  sglang_mem_fraction: 0.75
  routing_replay: true
  grpo_std_normalization: false
  per_token_loss: true
async:
  max_concurrent_samples: 256  # two batches in flight, 128 per engine
checkpoint:
  # weights only (Adam's ~4.4 TB is not saved); the first save, after step 2, is the first full
  # 256k-model save on this setup and must land whole before the run goes on
  save_interval: 2
  keep: 1
  save_optimizer: false
  save_rollout_data: true  # a trainer failure replays on trainer nodes alone
  stage_dir: /tmp/miles-ckpt-stage
tracking:
  wandb_project: miles-dsv41
  wandb_entity: mobiuslab
extra_args:
  # each layer's checkpointed input waits in pinned host memory between forward and backward
  # (ext-020); with fix-011 this is what fits 256k on two trainer nodes
  - --custom-megatron-init-path
  - miles_ext.memory.ckpt_offload.install
  # per-rank uploads finish minutes apart; the save's closing barrier must outwait them
  - --distributed-timeout-minutes
  - "60"
