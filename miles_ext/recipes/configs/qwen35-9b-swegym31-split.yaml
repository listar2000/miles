# Qwen3.5-9B LoRA on the SWE-Gym tasks of Modal's SWE-Gym example, in split placement (ext-036):
# one H200 trainer node, eight one-GPU engines in their own H200 container.
name: qwen35-9b-swegym31-split
model:
  preset: qwen3.5-9b
  backend: megatron
cluster:
  gpu: H200
  nodes: 1  # the trainer; the engines are cluster.engine
  train_gpus: 8
  cpu: 32
  memory_gib: 512
  timeout_hours: 4
  placement: split
  engine:
    memory_gib: 256
    idle_minutes: 30
parallel:
  tp: 2
  pp: 1  # adapter sync to separate engines needs PP 1 (hook-011)
  cp: 4  # a 128k-token sample is 32k tokens per rank
lora:
  rank: 32
  alpha: 32
  serving: adapter
  # native LoRA has no adapters for the gated-delta-net layers, so attention projections only
  target_modules: q_proj,k_proj,v_proj,o_proj
rollout:
  gpus_per_engine: 1
  context_length: 131072
taskset:
  tasks_volume: miles-datasets:/swegym31/tasks
  prompts: $MILES_DATA/prompts/swegym31-gold28.jsonl  # the 28 whose tests pass with the gold patch
  harness: mini-swe-agent-sandbox
agent:
  max_steps: 20
  exec_timeout: 120
  timeout: 2400
  trial_timeout: 3600
  verifier_timeout: 900
  context_exhausted_scores_zero: true
sandbox:
  provider: sail
  lifetime_secs: 14400
algorithm:
  mode: fully_async
  num_rollout: 60  # the run is bounded by time, not steps
  rollout_batch_size: 16
  n_samples: 8
  temperature: 1.0
  max_response_len: 8192  # per turn
  max_seq_len: 131072
  lr: 1.0e-5  # 10x the example's 1e-6, which needs ~30 batches of 256 to move the reward
  eps_clip: 0.2
  eps_clip_high: 0.28
  group_filter: nonzero_std  # DAPO: drop groups whose samples all scored the same
  max_weight_staleness: 2
async:
  max_concurrent_samples: 256
checkpoint:
  save_interval: 5
  keep: 2
  save_optimizer: true
  save_rollout_data: true
tracking:
  wandb_project: miles-swegym-split
  wandb_entity: mobiuslab
